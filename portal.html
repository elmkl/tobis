<!DOCTYPE html>
<html>
<head>
    <title>tobis api portal</title>
    <style>
        body { 
            font-family: 'Crimson Text', Georgia, serif; 
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            text-align: center;
        }
        
        #topLogo {
            max-width: 200px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2.2em;
            margin: 10px 0;
            font-weight: bold;
        }

        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .nav-links {
            margin-bottom: 30px;
        }

        .nav-links a, .nav-links button {
            background: none;
            border: none;
            color: #000000;
            font-family: inherit;
            font-size: 1.1em;
            cursor: pointer;
            padding: 0 10px;
            text-decoration: underline;
        }

        .tab-content {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Form Container */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px; /* Gives the form a nice uniform width */
            margin-bottom: 20px;
        }

        /* Wraps each label/input pair in a horizontal row */
        .form-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            width: 100%;
            gap: 15px; /* Space between label and input */
            margin-bottom: 15px;
        }

        /* THIS IS THE FIX: Lock the labels to a specific width so they don't push the inputs */
        .form-group label {
            font-weight: bold;
            width: 60px; /* Fixed width */
            min-width: 60px; /* Prevents it from crushing down */
            text-align: right; /* Aligns the colons perfectly */
            margin: 0;
        }

        /* Makes the inputs take up exactly the remaining space in the row */
        .form-group select, 
        .form-group input {
            flex: 1; /* Stretch to fill */
            width: 100%;
            font-family: inherit;
            font-size: 1em;
            padding: 8px 12px;
            border: 1px solid #000;
            border-radius: 5px;
            background-color: #fff;
            color: #000;
            box-sizing: border-box;
        }

        button[type="submit"] {
            font-family: inherit;
            font-size: 1.1em;
            padding: 10px 12px;
            border: 1px solid #000;
            border-radius: 5px;
            background-color: #fff;
            color: #000;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #f0f0f0;
        }

        .results-box {
            display: none;
            width: 100%;
            border: 1px solid #000;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            box-sizing: border-box;
            overflow-x: auto;
            background-color: #f9f9f9;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        /* Keep ALSA city wrapper behaving like the other rows */
        #cityWrapper {
            display: none;
            flex-direction: row;
            width: 100%;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        #cityWrapper label {
            font-weight: bold;
            width: 60px;
            min-width: 60px;
            text-align: right;
            margin: 0;
        }
        
        #cityWrapper select {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>
    <img src="./logo.png" alt="Tobis" id="topLogo">
    <div class="subtitle">public transit data in Morocco</div>
    
    <div class="nav-links">
        <a href="/docs" target="_blank">API Docs</a> | 
        <button type="button" onclick="switchTab('nat')">National Transit</button> | 
        <button type="button" onclick="switchTab('urb')">Urban Transport</button>
    </div>

    <div id="nat" class="tab-content">
        <form id="natForm">
            <div class="form-group">
                <label for="from">From:</label>
                <select id="from" required><option value="">Loading cities...</option></select>
            </div>
            
            <div class="form-group">
                <label for="to">To:</label>
                <select id="to" required><option value="">Loading cities...</option></select>
            </div>
            
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" required>
            </div>
            
            <button type="submit">Search</button>
        </form>
        <div id="natResFrame" class="results-box">
            <pre id="natRes"></pre>
        </div>
    </div>

    <div id="urb" class="tab-content" style="display:none">
        <form id="urbForm">
            <div class="form-group">
                <label for="prov">Provider:</label>
                <select id="prov" onchange="updateUrbanForm()" required>
                    <option value="">Select Provider...</option>
                    <option value="alsa">ALSA</option>
                    <option value="laayoune">Laayoune Bus</option>
                    <option value="aui">AUI Ifrane</option>
                    <option value="sapst">SAPST Taghazout</option>
                </select>
            </div>
            
            <div class="form-group" id="cityWrapper" style="display:none;">
                <label for="city">City:</label>
                <select id="city" onchange="loadAlsaRoutes()">
                    <option value="">Select City...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="route">Route:</label>
                <select id="route" required>
                    <option value="">Select Route...</option>
                </select>
            </div>

            <button type="submit">Track Live</button>
        </form>
        <div id="urbResFrame" class="results-box">
            <pre id="urbRes"></pre>
        </div>
    </div>

<script>
    // get tomorrows date
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('date').valueAsDate = tomorrow;
    
    function switchTab(tabName) {
        if (tabName === 'nat') {
            document.getElementById('nat').style.display = 'flex';
            document.getElementById('urb').style.display = 'none';
        } else {
            document.getElementById('nat').style.display = 'none';
            document.getElementById('urb').style.display = 'flex';
        }
    }

    // fetch all cities and populate dropdowns
    window.addEventListener('DOMContentLoaded', async function() {
        try {
            const response = await fetch('/cities');
            const data = await response.json();
            
            let optionsHtml = '<option value="">Select a city...</option>';
            for (let i = 0; i < data.cities.length; i++) {
                let city = data.cities[i];
                optionsHtml += '<option value="' + city + '">' + city.toUpperCase() + '</option>';
            }
            
            const fromSelect = document.getElementById('from');
            const toSelect = document.getElementById('to');
            
            fromSelect.innerHTML = optionsHtml;
            toSelect.innerHTML = optionsHtml;
            
            fromSelect.value = 'casablanca';
            toSelect.value = 'tanger';
        } catch (error) {
            console.error("Failed to load cities", error);
        }
    });

    // figure out what happens when you select a provider in the urban form
    async function updateUrbanForm() {
        const provider = document.getElementById('prov').value;
        const citySelect = document.getElementById('city');
        const routeSelect = document.getElementById('route');
        const cityWrapper = document.getElementById('cityWrapper');
        
        routeSelect.innerHTML = '<option value="">Loading routes...</option>';

        if (provider === 'alsa') {
            cityWrapper.style.display = 'flex'; // Uses flex so it stays side-by-side
            try {
                const response = await fetch('/urban/alsa/cities');
                const cities = await response.json();
                
                let optionsHtml = '<option value="">Select City...</option>';
                for (let i = 0; i < cities.length; i++) {
                    optionsHtml += '<option value="' + cities[i] + '">' + cities[i].toUpperCase() + '</option>';
                }
                citySelect.innerHTML = optionsHtml;
            } catch(error) { 
                citySelect.innerHTML = '<option value="">Error loading</option>'; 
            }
            routeSelect.innerHTML = '<option value="">Select Route...</option>';
            
        } else if (provider) {
            cityWrapper.style.display = 'none';
            citySelect.value = ''; 
            
            let url = '';
            if (provider === 'laayoune') { url = '/urban/laayoune/routes'; }
            if (provider === 'aui') { url = '/urban/ifrane-aui/routes'; }
            if (provider === 'sapst') { url = '/urban/taghazout-bay/routes'; }

            try {
                const response = await fetch(url);
                const data = await response.json();
                const routes = data.routes || [];
                
                let optionsHtml = '<option value="">Select Route...</option>';
                for (let i = 0; i < routes.length; i++) {
                    let r = routes[i];
                    optionsHtml += '<option value="' + r.id + '">' + r.id + ' - ' + (r.name || '') + '</option>';
                }
                routeSelect.innerHTML = optionsHtml;
            } catch(error) {
                routeSelect.innerHTML = '<option value="">Error loading</option>';
            }
        }
    }

    // fetch routes specific to cities served by ALSA
    async function loadAlsaRoutes() {
        const city = document.getElementById('city').value;
        const routeSelect = document.getElementById('route');
        
        if (!city) {
            routeSelect.innerHTML = '<option value="">Select Route...</option>';
            return;
        }
        
        routeSelect.innerHTML = '<option value="">Loading...</option>';
        try {
            const response = await fetch('/urban/alsa/' + city + '/routes');
            const data = await response.json();
            
            let optionsHtml = '<option value="">Select Route...</option>';
            if (data.lines) {
                for (let i = 0; i < data.lines.length; i++) {
                    let l = data.lines[i];
                    optionsHtml += '<option value="' + l.id + '">' + l.id + ' - ' + (l.name || '') + '</option>';
                }
            }
            routeSelect.innerHTML = optionsHtml;
        } catch(error) {
            routeSelect.innerHTML = '<option value="">API Error / Offline</option>';
        }
    }

    // search national transit options
    document.getElementById('natForm').onsubmit = async function(event) {
        event.preventDefault();
        
        const frame = document.getElementById('natResFrame');
        const resultsDiv = document.getElementById('natRes');
        
        frame.style.display = 'block';
        resultsDiv.textContent = "Loading...";
        
        try {
            const fromCity = document.getElementById('from').value;
            const toCity = document.getElementById('to').value;
            const travelDate = document.getElementById('date').value;
            
            const response = await fetch('/national/search?from=' + fromCity + '&to=' + toCity + '&travel_date=' + travelDate);
            const data = await response.json();
            resultsDiv.textContent = JSON.stringify(data, null, 2);
        } catch(error) { 
            resultsDiv.textContent = error; 
        }
    };

    // track urban transit options
    document.getElementById('urbForm').onsubmit = async function(event) {
        event.preventDefault();
        
        const frame = document.getElementById('urbResFrame');
        const resultsDiv = document.getElementById('urbRes');
        
        frame.style.display = 'block';
        resultsDiv.textContent = "Loading...";
        
        try {
            const provider = document.getElementById('prov').value;
            const city = document.getElementById('city').value;
            const route = document.getElementById('route').value;
            
            let url = '';
            if (provider === 'alsa') { url = '/urban/alsa/' + city + '/track/' + route; }
            if (provider === 'laayoune') { url = '/urban/laayoune/track/' + route; }
            if (provider === 'aui') { url = '/urban/ifrane-aui/track/' + route; }
            if (provider === 'sapst') { url = '/urban/taghazout-bay/track'; }

            const response = await fetch(url);
            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.detail || "Error " + response.status);
            }
            
            resultsDiv.textContent = JSON.stringify(data, null, 2);
        } catch(error) { 
            resultsDiv.textContent = error; 
        }
    };
</script>
</body>
</html>
